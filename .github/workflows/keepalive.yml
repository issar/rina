# Keeps the free Supabase project awake: Supabase pauses free projects after ~1 week of low activity.
# Runs daily. The second step re-enables this workflow, because GitHub disables scheduled
# workflows in public repos after 60 days without repo activity.
# The key below is the publishable (public) key, the same one the app ships with.
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://wvguwkxtvwwgfbttgxqw.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_LhD5E7M7UQ00Wyme_dF1QA_Xh0Y3J25" \
            -H "Content-Type: application/json" -d '{}'
      - name: Keep this schedule enabled
        if: always()
        run: gh workflow enable keepalive.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
